# The documentation site: the Markdown pages of docs/, as they read on GitHub,
# with one addition: a code example shown in several languages is a set of
# tabs, and choosing a language once shows it in every set on every page.
# Build it with `mkdocs build --strict` (pip install "mkdocs-material==9.6.*"
# "mkdocstrings-python==2.0.*" "ruff==0.17.*"); .github/workflows/docs.yml
# publishes it from main.
site_name: Gamut
site_url: https://bijective-systems-org.github.io/gamut/
site_description: An open file format for parametric simulation studies and the models fitted to them.
repo_url: https://github.com/bijective-systems-org/gamut
docs_dir: docs
site_dir: site
use_directory_urls: false     # a page is page.html beside its images, so HTML paths resolve as on GitHub

validation:
  links:
    anchors: warn             # a link to a heading that is not there stops the strict build

theme:
  name: material
  custom_dir: overrides       # the header logo, light and dark
  favicon: assets/mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle: {icon: material/weather-night, name: Dark}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle: {icon: material/weather-sunny, name: Light}
  features:
    - navigation.tabs          # the sections as tabs under the header
    - navigation.tabs.sticky   # and kept in view while a page scrolls
    - navigation.indexes       # a section's first page is its index
    - content.tabs.link        # one choice of language switches every tab set
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

copyright: © 2026 Bijective Systems

extra:
  generator: false

plugins:
  - search
  - mkdocstrings:             # the Python reference, from the package's docstrings
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: null
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: false
            separate_signature: true
            show_signature_annotations: true
            line_length: 80
            members_order: source
            filters: ["!^_"]

extra_css:
  - assets/site.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.snippets:         # the specification and changelog pages include the files themselves
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.blocks.tab:       # /// tab | Python ... ///, which reads as plain text on GitHub
      alternate_style: true

nav:
  - Home: README.md
  - Installing: install.md
  - How it works:
      - concepts/README.md
      - concepts/meshes.md
      - concepts/models.md
      - concepts/the-file.md
      - concepts/languages.md
      - concepts/validation.md
      - Files from outside: security.md
  - Examples:
      - guide/README.md
      - guide/01-run-tables.md
      - guide/02-one-mesh.md
      - guide/03-geometry-families.md
      - guide/04-changing-meshes.md
      - guide/05-time-series.md
      - guide/06-uncertainty-and-gradients.md
      - guide/07-models.md
      - guide/08-reading-parts.md
      - guide/09-combining-files.md
      - guide/10-vtk.md
  - Reference:
      - reference/python.md
      - reference/command-line.md
      - reference/matlab.md
      - reference/julia.md
      - reference/c-and-cpp.md
      - reference/rust.md
      - reference/selecting.md
      - Specification: reference/specification.md
      - comparison.md
      - benchmarks.md
      - Changelog: reference/changelog.md
