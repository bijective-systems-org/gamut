<text class="muted small" x="14" y="161">1 thread</text>
<text class="gamut-text number" x="369" y="155" text-anchor="end">66 MB</text>
<text class="gamut-text number" x="476" y="155" text-anchor="end">1.86 ms</text>
<text class="gamut-text number" x="624" y="155" text-anchor="end">121 ms</text>
<text class="gamut-text number" x="746" y="155" text-anchor="end">1.87 ms</text>
