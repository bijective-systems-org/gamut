<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 624" width="760" height="624" role="img" aria-label="Measured study sizes and reads">
<title>Study size and read time</title>
<desc>Two tables compare the same data across native formats. Blue identifies Gamut. All values are measured; lower values indicate smaller files or faster reads. The benchmark page has accessible tables, configurations and limitations.</desc>
<style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .page, .body { fill: #FFFFFF; } .ink { fill: #1F2328; } .muted { fill: #59636E; }
      .section { fill: #F0F3F6; } .head { fill: #F6F8FA; } .stripe { fill: #FAFBFC; }
      .gamut-row { fill: #EDF5FF; } .accent { fill: #0070DC; } .gamut-text { fill: #005EB8; }
      .rule { stroke: #D8DEE5; stroke-width: 1; fill: none; }
      .title { font-size: 18px; font-weight: 600; } .label { font-size: 14px; font-weight: 600; }
      .name { font-size: 13px; font-weight: 600; } .small { font-size: 11px; }
      .column { font-size: 11px; font-weight: 600; }
      .number { font-size: 14px; font-variant-numeric: tabular-nums; }
      @media (prefers-color-scheme: dark) {
        .page, .body { fill: #0D1117; } .ink { fill: #E6EDF3; } .muted { fill: #9AA6B4; }
        .section { fill: #1B2532; } .head { fill: #151D27; } .stripe { fill: #111820; }
        .gamut-row { fill: #102C48; } .accent { fill: #74BFF8; } .gamut-text { fill: #8CCBFF; }
        .rule { stroke: #303D4C; }
      }
    </style>
<rect class="page" width="100%" height="100%"/>
<text class="ink title" x="0" y="20">Study size and read time</text>
<text class="muted small" x="0" y="40">Same data in each representation · lower values mean smaller files or faster reads</text>
<defs><clipPath id="table-0"><rect x="0.5" y="54.5" width="759" height="235" rx="6"/></clipPath></defs>
<g clip-path="url(#table-0)">
<rect class="body" x="0" y="54" width="760" height="236"/>
<rect class="section" x="0" y="54" width="760" height="38"/>
<text class="ink label" x="14" y="78">Capsule family</text>
<text class="muted small" x="746" y="78" text-anchor="end">1,364 runs · 6,722 nodes · 44 geometries</text>
<rect class="head" x="0" y="92" width="760" height="38"/>
<text class="muted column" x="14" y="116">FORMAT / CONFIGURATION</text>
<text class="muted column" x="369" y="116" text-anchor="end">File size</text>
<text class="muted column" x="476" y="108" text-anchor="end">One run</text>
<text class="muted small" x="476" y="122" text-anchor="end">read</text>
<text class="muted column" x="624" y="108" text-anchor="end">One node</text>
<text class="muted small" x="624" y="122" text-anchor="end">across all runs</text>
<text class="muted column" x="746" y="108" text-anchor="end">Run query</text>
<text class="muted small" x="746" y="122" text-anchor="end">select + read</text>
