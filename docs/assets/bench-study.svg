<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 692" width="760" height="692" role="img" aria-label="Study size and read time relative to Gamut">
<title>Size and read time against Gamut</title>
<desc>Four horizontal bar charts compare formats on two datasets. Dark blue is the triangulated capsule family; light blue is the XFOIL sweep. Within each dataset every format uses the same mesh. Each bar is the format's size or time divided by Gamut's on one thread on the same dataset, on a linear axis from 0 to 3 times; longer bars are cut and labelled with their ratio. Measured values are labelled. Accessible tables and methodology are in the benchmark page.</desc>
<style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .page { fill: #FFFFFF; } .ink { fill: #1F2328; } .muted { fill: #59636E; }
      .capsule { fill: #0070DC; } .xfoil { fill: #74B5EB; }
      .grid { stroke: #E1E6EC; stroke-width: 1; } .base { stroke: #1F2328; stroke-width: 1.5; }
      .cut { stroke: #FFFFFF; stroke-width: 2; fill: none; }
      .title { font-size: 18px; font-weight: 600; } .heading { font-size: 13px; font-weight: 600; }
      .name { font-size: 12px; } .ours { font-weight: 600; } .small { font-size: 11px; }
      .value { font-size: 11px; font-variant-numeric: tabular-nums; }
      @media (prefers-color-scheme: dark) {
        .page { fill: #0D1117; } .ink { fill: #E6EDF3; } .muted { fill: #9AA6B4; }
        .capsule { fill: #369BF7; } .xfoil { fill: #95CEFA; }
        .grid { stroke: #293440; } .base { stroke: #E6EDF3; } .cut { stroke: #0D1117; }
      }
    </style>
