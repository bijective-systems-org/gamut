<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 238" width="680" height="238" role="img" aria-label="One node across every run">
<style>
    .ink { fill: #1F2328; } .soft { fill: #59636E; } .grid { stroke: #D0D7DE; stroke-width: 1; }
    .bar { fill: #8C959F; } .ours { fill: #4A9FF5; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E6EDF3; } .soft { fill: #9198A1; } .grid { stroke: #30363D; } .bar { fill: #6E7681; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; }
    .h { font-size: 13px; font-weight: 600; }
  </style>
<text class="ink h" x="0" y="18">One node across every run</text>
<text class="soft" x="0" y="36">capsule family, 1,364 runs; median of five, shorter is faster</text>
<line class="grid" x1="190.0" y1="46" x2="190.0" y2="208"/>
<text class="soft" x="190.0" y="226" text-anchor="middle">1 ms</text>
<line class="grid" x1="290.0" y1="46" x2="290.0" y2="208"/>
<text class="soft" x="290.0" y="226" text-anchor="middle">10 ms</text>
<line class="grid" x1="390.0" y1="46" x2="390.0" y2="208"/>
<text class="soft" x="390.0" y="226" text-anchor="middle">100 ms</text>
<line class="grid" x1="490.0" y1="46" x2="490.0" y2="208"/>
<text class="soft" x="490.0" y="226" text-anchor="middle">1 s</text>
<line class="grid" x1="590.0" y1="46" x2="590.0" y2="208"/>
<text class="soft" x="590.0" y="226" text-anchor="middle">10 s</text>
<text class="ink" x="180" y="67" text-anchor="end">Zarr (xarray)</text>
<rect class="bar" x="190" y="56" width="63.3" height="16" rx="2"/>
<text class="soft" x="259.3" y="68">4.29 ms</text>
<text class="ink" x="180" y="93" text-anchor="end">Gamut, 4 threads</text>
<rect class="ours" x="190" y="82" width="157.7" height="16" rx="2"/>
<text class="soft" x="353.7" y="94">37.8 ms</text>
<text class="ink" x="180" y="119" text-anchor="end">netCDF-4 (xarray)</text>
<rect class="bar" x="190" y="108" width="173.6" height="16" rx="2"/>
<text class="soft" x="369.6" y="120">54.4 ms</text>
<text class="ink" x="180" y="145" text-anchor="end">HDF5, a group per run</text>
<rect class="bar" x="190" y="134" width="190.4" height="16" rx="2"/>
<text class="soft" x="386.4" y="146">80.1 ms</text>
<text class="ink" x="180" y="171" text-anchor="end">Gamut</text>
<rect class="ours" x="190" y="160" width="209.4" height="16" rx="2"/>
<text class="soft" x="405.4" y="172">124 ms</text>
<text class="ink" x="180" y="197" text-anchor="end">VTK folder</text>
<rect class="bar" x="190" y="186" width="369.0" height="16" rx="2"/>
<text class="soft" x="565.0" y="198">4.9 s</text>
</svg>
