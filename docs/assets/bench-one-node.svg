<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="680" height="316" role="img" aria-label="One node across every run">
<style>
    .ink { fill: #1F2328; } .soft { fill: #59636E; } .grid { stroke: #D0D7DE; stroke-width: 1; }
    .bar { fill: #8C959F; } .ours { fill: #4A9FF5; } .page { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .page { fill: #0D1117; } .ink { fill: #E6EDF3; } .soft { fill: #9198A1; } .grid { stroke: #30363D; } .bar { fill: #6E7681; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; }
    .h { font-size: 13px; font-weight: 600; }
  </style>
<rect class="page" width="100%" height="100%"/>
<text class="ink h" x="0" y="18">One node across every run</text>
<text class="soft" x="0" y="36">capsule family, 1,364 runs; median of five, shorter is faster</text>
<line class="grid" x1="190.0" y1="46" x2="190.0" y2="286"/>
<text class="soft" x="190.0" y="304" text-anchor="middle">100 µs</text>
<line class="grid" x1="270.0" y1="46" x2="270.0" y2="286"/>
<text class="soft" x="270.0" y="304" text-anchor="middle">1 ms</text>
<line class="grid" x1="350.0" y1="46" x2="350.0" y2="286"/>
<text class="soft" x="350.0" y="304" text-anchor="middle">10 ms</text>
<line class="grid" x1="430.0" y1="46" x2="430.0" y2="286"/>
<text class="soft" x="430.0" y="304" text-anchor="middle">100 ms</text>
<line class="grid" x1="510.0" y1="46" x2="510.0" y2="286"/>
<text class="soft" x="510.0" y="304" text-anchor="middle">1 s</text>
<line class="grid" x1="590.0" y1="46" x2="590.0" y2="286"/>
<text class="soft" x="590.0" y="304" text-anchor="middle">10 s</text>
<text class="ink" x="180" y="67" text-anchor="end">NumPy arrays, uncompressed</text>
<rect class="bar" x="190" y="56" width="67.5" height="16" rx="2"/>
<text class="soft" x="263.5" y="68">697 µs</text>
<text class="ink" x="180" y="93" text-anchor="end">Zarr (xarray)</text>
<rect class="bar" x="190" y="82" width="134.1" height="16" rx="2"/>
<text class="soft" x="330.1" y="94">4.75 ms</text>
<text class="ink" x="180" y="119" text-anchor="end">Gamut, 4 threads</text>
<rect class="ours" x="190" y="108" width="207.1" height="16" rx="2"/>
<text class="soft" x="403.1" y="120">38.8 ms</text>
<text class="ink" x="180" y="145" text-anchor="end">netCDF-4 (xarray)</text>
<rect class="bar" x="190" y="134" width="220.6" height="16" rx="2"/>
<text class="soft" x="416.6" y="146">57.2 ms</text>
<text class="ink" x="180" y="171" text-anchor="end">HDF5, a group per run</text>
<rect class="bar" x="190" y="160" width="235.7" height="16" rx="2"/>
<text class="soft" x="431.7" y="172">88.3 ms</text>
<text class="ink" x="180" y="197" text-anchor="end">Gamut</text>
<rect class="ours" x="190" y="186" width="248.4" height="16" rx="2"/>
<text class="soft" x="444.4" y="198">127 ms</text>
<text class="ink" x="180" y="223" text-anchor="end">VTKHDF, a step per run</text>
<rect class="bar" x="190" y="212" width="257.5" height="16" rx="2"/>
<text class="soft" x="453.5" y="224">165 ms</text>
<text class="ink" x="180" y="249" text-anchor="end">NumPy, a file per run</text>
<rect class="bar" x="190" y="238" width="274.9" height="16" rx="2"/>
<text class="soft" x="470.9" y="250">273 ms</text>
<text class="ink" x="180" y="275" text-anchor="end">VTK folder</text>
<rect class="bar" x="190" y="264" width="370.2" height="16" rx="2"/>
<text class="soft" x="566.2" y="276">4.24 s</text>
</svg>
