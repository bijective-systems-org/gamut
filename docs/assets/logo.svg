    <path d="M166.22 20.45A9.00 7.50 0 1 0 158.00 31.00A9.00 7.50 0 1 1 149.78 41.55"/>
    <path d="M181.00 7.00L181.00 46.00M175.00 16.00L192.00 16.00"/>
    <path d="M198.50 46.00L198.50 31.00A12.00 15.00 0 0 1 210.50 16.00"/>
    <path d="M218.50 31.00A15.00 15.00 0 1 1 248.50 31.00A15.00 15.00 0 1 1 218.50 31.00M248.50 16.00L248.50 46.00"/>
  </g>
</svg>
