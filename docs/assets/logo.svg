<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 0 246 62" width="246" height="62"
     role="img" aria-labelledby="gamut-logo" fill="none" stroke-width="5.0"
     stroke-linecap="round" stroke-linejoin="round">
  <title id="gamut-logo">Gamut</title>
  <!-- The mark: one closed outline on four nodes, two of its edges on the
       square through them and two on the circle through the same four: one
       shape becoming another without moving a node, as a family of meshes
       morphs while its nodes stay in correspondence. -->
  <style>
    .mark { stroke: #4A9FF5; }
    .word { stroke: #1F2328; }
    .node { fill: #1F2328; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .word { stroke: #E6EDF3; }
      .node { fill: #E6EDF3; }
    }
  </style>
  <path class="mark" stroke-linejoin="miter" stroke-miterlimit="10"
        d="M21.50 7.50L40.50 26.50A19.00 19.00 0 0 1 21.50 45.50L2.50 26.50A19.00 19.00 0 0 1 21.50 7.50Z"/>
  <circle class="node" cx="21.5" cy="7.5" r="4"/>
  <circle class="node" cx="40.5" cy="26.5" r="4"/>
  <circle class="node" cx="21.5" cy="45.5" r="4"/>
  <circle class="node" cx="2.5" cy="26.5" r="4"/>
  <g class="word">
    <path d="M58.50 31.00A15.00 15.00 0 1 1 88.50 31.00A15.00 15.00 0 1 1 58.50 31.00M88.50 16.00L88.50 46.00A15.00 13.00 0 0 1 61.50 53.00"/>
    <path d="M96.50 31.00A15.00 15.00 0 1 1 126.50 31.00A15.00 15.00 0 1 1 96.50 31.00M126.50 16.00L126.50 46.00"/>
    <path d="M134.50 46.00L134.50 31.00A11.00 15.00 0 0 1 156.50 31.00L156.50 46.00M156.50 31.00A11.00 15.00 0 0 1 178.50 31.00L178.50 46.00"/>
    <path d="M186.50 16.00L186.50 31.00A11.00 15.00 0 0 0 208.50 31.00M208.50 16.00L208.50 46.00"/>
    <path d="M224.50 7.00L224.50 46.00M218.50 16.00L235.50 16.00"/>
  </g>
</svg>
