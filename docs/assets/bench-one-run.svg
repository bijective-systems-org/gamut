<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160" role="img" aria-label="One run's points and pressure">
<style>
    .ink { fill: #1F2328; } .soft { fill: #59636E; } .grid { stroke: #D0D7DE; stroke-width: 1; }
    .bar { fill: #8C959F; } .ours { fill: #4A9FF5; } .page { fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .page { fill: #0D1117; } .ink { fill: #E6EDF3; } .soft { fill: #9198A1; } .grid { stroke: #30363D; } .bar { fill: #6E7681; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; }
    .h { font-size: 13px; font-weight: 600; }
  </style>
<rect class="page" width="100%" height="100%"/>
<text class="ink h" x="0" y="18">One run's points and pressure</text>
<text class="soft" x="0" y="36">AirfRANS, 100 runs on their own meshes; median of five, shorter is faster</text>
<line class="grid" x1="190.0" y1="46" x2="190.0" y2="130"/>
<text class="soft" x="190.0" y="148" text-anchor="middle">0</text>
<line class="grid" x1="343.7" y1="46" x2="343.7" y2="130"/>
<text class="soft" x="343.7" y="148" text-anchor="middle">50 ms</text>
<line class="grid" x1="497.5" y1="46" x2="497.5" y2="130"/>
<text class="soft" x="497.5" y="148" text-anchor="middle">100 ms</text>
<text class="ink" x="180" y="67" text-anchor="end">Gamut</text>
<rect class="ours" x="190" y="56" width="47.1" height="16" rx="2"/>
<text class="soft" x="243.1" y="68">15.3 ms</text>
<text class="ink" x="180" y="93" text-anchor="end">HDF5, a group per run</text>
<rect class="bar" x="190" y="82" width="50.1" height="16" rx="2"/>
<text class="soft" x="246.1" y="94">16.3 ms</text>
<text class="ink" x="180" y="119" text-anchor="end">VTK folder</text>
<rect class="bar" x="190" y="108" width="381.0" height="16" rx="2"/>
<text class="soft" x="577.0" y="120">124 ms</text>
</svg>
