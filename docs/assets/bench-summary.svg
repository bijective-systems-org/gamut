<rect class="bar" x="469.0" y="311" width="2.0" height="15" rx="2"/>
<text class="soft" x="477.0" y="323">4.29 ms</text>
<rect class="bar" x="469.0" y="333" width="227.0" height="15" rx="2"/>
<text class="soft" x="702.0" y="345">4.9 s</text>
</svg>
