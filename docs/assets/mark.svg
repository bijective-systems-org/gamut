<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="mestra-mark"
     fill="none" stroke="currentColor" stroke-width="6.0"
     stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="10">
  <title id="mestra-mark">mestra</title>
  <!-- One closed outline on four nodes: two of its edges are the square through
       them, two are the circle through the same four, so one shape is caught in
       the act of becoming another without moving a node. That is the format in a
       figure: the same data read identically in four languages, and a family of
       meshes that morphs while its nodes stay in correspondence. -->
  <path d="M32.00 7.00L57.00 32.00A25.00 25.00 0 0 1 32.00 57.00L7.00 32.00A25.00 25.00 0 0 1 32.00 7.00Z"/>
</svg>
