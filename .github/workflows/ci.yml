name: ci

# What this repository keeps true, on every push to main and every pull
# request: the core and its tests, the C++ interface's among them, also
# under the address and undefined-behaviour sanitizers; only the C
# interface leaving the library; the wheel and the Python suite on it
# (which runs the examples and holds the guide to them); the corpus from
# Python, Julia and MATLAB; and the core and the wheel on macOS and Windows.
# Packages link HDF5 statically, so every job builds the core that way,
# with tools/build_deps.sh.
#
# Every action is pinned to a full commit SHA with its tag beside it: a tag
# can move and a SHA cannot. Nothing here uses a secret, and the only
# permission is reading this repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: linux (core, sanitizers, wheel, Python, corpus, Julia)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.10
            3.13
            3.12

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build
          python -m pip install --upgrade pip
          python -m pip install build numpy h5py pytest

      - name: zlib and HDF5, static
        run: bash tools/build_deps.sh "$RUNNER_TEMP/deps" > "$RUNNER_TEMP/deps.log" 2>&1 || { tail -50 "$RUNNER_TEMP/deps.log"; exit 1; }

      - name: The core and its tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGAMUT_STATIC_HDF5=ON \
                -DHDF5_ROOT="$RUNNER_TEMP/deps" -DZLIB_ROOT="$RUNNER_TEMP/deps"
          cmake --build build -j2
          ./build/core_unit_tests
          ./build/core_writer_reader_tests
          (cd build && ./header_tests)

      - name: Only the C interface leaves the library
        run: |
          others=$(nm -D --defined-only build/libgamut.so | awk '{print $3}' | grep -v '^gamut_' || true)
          test -z "$others" || { echo "also exported: $others"; exit 1; }
          if ldd build/libgamut.so | grep hdf5; then echo "links a shared HDF5"; exit 1; fi

      - name: The core under the address and undefined-behaviour sanitizers
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28        # the runner kernel's default breaks ASan
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGAMUT_SANITIZE=ON \
                -DGAMUT_STATIC_HDF5=ON -DHDF5_ROOT="$RUNNER_TEMP/deps" -DZLIB_ROOT="$RUNNER_TEMP/deps"
          cmake --build build-asan -j2
          ./build-asan/core_unit_tests
          ./build-asan/core_writer_reader_tests
          (cd build-asan && ./header_tests)

      - name: The wheel
        run: |
          CMAKE_ARGS="-DGAMUT_STATIC_HDF5=ON -DHDF5_ROOT=$RUNNER_TEMP/deps -DZLIB_ROOT=$RUNNER_TEMP/deps" \
            python -m build --outdir dist .

      - name: The Python suite on the installed wheel (3.12 with every extra; 3.10, 3.13)
        # From a directory outside the checkout, so `import gamut` is the
        # wheel; the tests reach the examples and docs by their own path.
        run: |
          wheel=$(ls dist/*.whl)
          for v in 3.12 3.10 3.13; do
            spec="$wheel"; extras="pytest h5py"
            [ "$v" = 3.12 ] && { spec="$wheel[test]"; extras=""; }
            "python$v" -m venv "$RUNNER_TEMP/venv-$v"
            "$RUNNER_TEMP/venv-$v/bin/python" -m pip install -q "$spec" $extras
            (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv-$v/bin/python" -m pytest -q -p no:cacheprovider \
              "$GITHUB_WORKSPACE/python/tests")
          done

      - name: The corpus from Python
        run: |
          python corpus/generate.py "$RUNNER_TEMP/corpus"
          GAMUT_LIBRARY="$PWD/build/libgamut.so" python corpus/check.py "$RUNNER_TEMP/corpus" | tee "$RUNNER_TEMP/corpus.txt"
          grep -qE '^[1-9][0-9]* cases' "$RUNNER_TEMP/corpus.txt"

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.11'

      - name: Julia, its examples, and the corpus from Julia
        env:
          GAMUT_LIBRARY: ${{ github.workspace }}/build/libgamut.so
        run: |
          julia --project=julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=julia -e 'include("julia/test/runtests.jl")'
          mkdir -p "$RUNNER_TEMP/jexample"
          (cd "$RUNNER_TEMP/jexample" && julia --project="$GITHUB_WORKSPACE/julia" "$GITHUB_WORKSPACE/examples/julia/one_mesh.jl")
          # The README's sweep prints the README's line.
          (cd "$RUNNER_TEMP/jexample" && julia --project="$GITHUB_WORKSPACE/julia" "$GITHUB_WORKSPACE/examples/julia/sweep.jl") | tee "$RUNNER_TEMP/jsweep.txt"
          grep -qxF "$(grep -m1 '^lift of the runs that converged:' README.md)" "$RUNNER_TEMP/jsweep.txt"
          julia --project="$RUNNER_TEMP/jcorpus" -e 'using Pkg; Pkg.add(name="JSON", version="1.10"); Pkg.develop(path="julia")'
          julia --project="$RUNNER_TEMP/jcorpus" julia/test/check_corpus.jl "$RUNNER_TEMP/corpus" | tee "$RUNNER_TEMP/jcorpus.txt"
          grep -qE '^[1-9][0-9]* cases' "$RUNNER_TEMP/jcorpus.txt"

      - name: Two HDF5 copies in one process
        if: github.event_name == 'push'
        env:
          WORK: ${{ runner.temp }}/two-hdf5
          PYTHON: python
        run: |
          sudo apt-get install -y -q libhdf5-dev     # the foreign 1.10 the test preloads
          python -m pip install -q pint xarray netCDF4 pyvista pandas
          bash tests/two_hdf5_linux.sh

  # MATLAB on a GitHub-hosted runner is licensed by MathWorks for public
  # repositories, with no secret and no licence token.
  matlab:
    name: matlab (suite, example, corpus)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: zlib, HDF5 and the core, static
        # MATLAB loads its own HDF5; a core with HDF5 linked in never meets it.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          bash tools/build_deps.sh "$RUNNER_TEMP/deps" > "$RUNNER_TEMP/deps.log" 2>&1 || { tail -50 "$RUNNER_TEMP/deps.log"; exit 1; }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAMUT_BUILD_TESTS=OFF \
                -DGAMUT_STATIC_HDF5=ON -DHDF5_ROOT="$RUNNER_TEMP/deps" -DZLIB_ROOT="$RUNNER_TEMP/deps"
          cmake --build build -j2

      - name: The corpus
        run: |
          python -m pip install -q numpy h5py
          python corpus/generate.py "$RUNNER_TEMP/corpus"
          echo "CORPUS=$RUNNER_TEMP/corpus" >> "$GITHUB_ENV"

      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3.1.0
        with:
          release: latest
          cache: true

      - name: Build the gateway, then the suite (with the example) and the corpus
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3.3.0
        with:
          command: "cd matlab; build_mex; addpath(fullfile(pwd, 'tests')); run_tests; corpus = getenv('CORPUS'); run(fullfile(pwd, 'tests', 'check_corpus.m'))"

  macos:
    name: macos (core, wheel, Python)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: zlib and HDF5, static
        run: bash tools/build_deps.sh "$RUNNER_TEMP/deps" > "$RUNNER_TEMP/deps.log" 2>&1 || { tail -50 "$RUNNER_TEMP/deps.log"; exit 1; }

      - name: The core and its tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAMUT_STATIC_HDF5=ON \
                -DHDF5_ROOT="$RUNNER_TEMP/deps" -DZLIB_ROOT="$RUNNER_TEMP/deps"
          cmake --build build -j3
          ./build/core_unit_tests
          ./build/core_writer_reader_tests
          (cd build && ./header_tests)

      - name: The wheel and the Python suite on it
        run: |
          python -m pip install -q build
          CMAKE_ARGS="-DGAMUT_STATIC_HDF5=ON -DHDF5_ROOT=$RUNNER_TEMP/deps -DZLIB_ROOT=$RUNNER_TEMP/deps" \
            python -m build --wheel --outdir dist .
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q "$(ls dist/*.whl)[test]"
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/python/tests"

  windows:
    name: windows (core, wheel, Python)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: zlib and HDF5, static
        run: |
          deps="$(cygpath -m "$RUNNER_TEMP")/deps"
          echo "DEPS=$deps" >> "$GITHUB_ENV"
          bash tools/build_deps.sh "$deps" > "$RUNNER_TEMP/deps.log" 2>&1 || { tail -60 "$RUNNER_TEMP/deps.log"; exit 1; }

      - name: The core and its tests (Release, with the static C runtime it ships with)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAMUT_STATIC_HDF5=ON \
                -DHDF5_ROOT="$DEPS" -DZLIB_ROOT="$DEPS"
          cmake --build build --config Release --parallel 2
          build/Release/core_unit_tests
          build/Release/core_writer_reader_tests
          (cd build/Release && ./header_tests)

      - name: The wheel and the Python suite on it
        run: |
          python -m pip install -q build
          CMAKE_ARGS="-DGAMUT_STATIC_HDF5=ON -DHDF5_ROOT=$DEPS -DZLIB_ROOT=$DEPS" \
            python -m build --wheel --outdir dist .
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/Scripts/python"
          "$py" -m pip install -q "$(ls dist/*.whl)[test]"
          cd "$RUNNER_TEMP" && "$py" -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/python/tests"
