name: publish

# The Python package goes to PyPI when a version tag (v1.2.3) is pushed: one
# wheel per platform, each with the core and HDF5 linked in and serving
# every Python 3.10 and later, and the sdist. MATLAB, Julia and C build from
# the tree, as docs/install.md says.
#
# `conformance` runs the whole of ci.yml at the tagged commit. `wheels`
# builds on each platform's own runner with cibuildwheel (the settings are
# in pyproject.toml), which installs each wheel in a fresh environment and
# runs the test suite against it; the suite checks that the package
# metadata, `gamut.__version__` and the core's own version agree. `sdist`
# builds the source distribution and checks the tag against
# pyproject.toml. Only `publish` holds a credential: an OpenID Connect
# token minted for the `pypi` environment, which PyPI trusts for this
# repository and this workflow file alone, so there is no API token
# anywhere. Every action is pinned to a commit, as in ci.yml.
#
# A pull request that changes the packaging, or a manual run, builds and
# tests the wheels and the sdist and uploads nothing: only a tag reaches
# `conformance` (ci.yml already runs on every pull request) and `publish`.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - pyproject.toml
      - CMakeLists.txt
      - tools/build_deps.sh
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conformance:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  wheels:
    name: wheel (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: Linux x86_64, os: ubuntu-24.04, platform: linux}
          - {name: macOS arm64, os: macos-15, platform: macos}
          - {name: macOS x86_64, os: macos-15-intel, platform: macos}
          - {name: Windows x86_64, os: windows-2022, platform: windows}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build and test the wheel
        run: |
          python -m pip install -q "cibuildwheel==3.*"
          python -m cibuildwheel --platform ${{ matrix.platform }} --output-dir wheelhouse
          ls -l wheelhouse

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: The tag names the version in pyproject.toml
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          print(f"tag {tag}; pyproject.toml {version}")
          if tag != f"v{version}":
              sys.exit("the tag and pyproject.toml disagree")
          PY

      - name: Build the sdist
        run: |
          python -m pip install -q build
          python -m build --sdist --outdir dist .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: upload to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [conformance, wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/gamut-format/
    permissions:
      # The OpenID Connect token is the credential; nothing else is granted.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # Checks the metadata first, and attaches a provenance attestation
        # to each file.
