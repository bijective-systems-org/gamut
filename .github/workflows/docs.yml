name: docs

# The documentation site (mkdocs.yml): built from main and published to
# GitHub Pages, and built without publishing for a pull request that
# changes it, so a broken link fails there first. The build is strict:
# any warning, a link to a page or heading that is not there among them
# (mkdocs.yml's validation), stops it.
#
# Every action is pinned to a full commit SHA with its tag beside it. The
# build job only reads this repository; the deploy job may write Pages
# and, to prove to Pages which workflow it is, request an OIDC token.

on:
  push:
    branches: [main]
    paths: ['docs/**', mkdocs.yml, .github/workflows/docs.yml]
  pull_request:
    paths: ['docs/**', mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time on each branch, and each run builds the branch as it
# stands when the run starts, not the commit that started it: GitHub may
# start an older run after a newer one, and the site a deploy leaves is
# still the newest main. A newer run on a pull request replaces an older
# one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -q "mkdocs-material==9.6.*"
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
