name: A change to the format
description: Something a file cannot say today, and a proposal for how it should.
labels: ["format"]
body:
  - type: markdown
    attributes:
      value: >-
        The specification and the corpus define the format, so a change
        lands in both and in the core together.
        CONTRIBUTING.md has the rules this form follows.
  - type: textarea
    id: case
    attributes:
      label: The file or workflow the format cannot represent
      description: A real study or workflow, with its runs, mesh and results.
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Proposed meaning, and what existing readers do with it
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Within version 1, or a new version
      description: >-
        Additive within gamut/1 (SPEC.md section 17: a reader that does
        not know it reports W5 and goes on), or a new major version.
    validations:
      required: true
  - type: textarea
    id: corpus
    attributes:
      label: Corpus cases that pin it
    validations:
      required: false
